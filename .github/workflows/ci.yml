name: GreenOps CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18

        env:
          POSTGRES_DB: greenops_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U postgres -d greenops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENVIRONMENT: test

      DATABASE_URL: >-
        postgresql+asyncpg://postgres:postgres@localhost:5432/greenops_ci

      TEST_DB_NAME: greenops_ai_test

      TEST_DATABASE_URL: >-
        postgresql+asyncpg://postgres:postgres@localhost:5432/greenops_ai_test

      TEST_DATABASE_ADMIN_URL: >-
        postgresql://postgres:postgres@localhost:5432/greenops_ai_test

      ADMIN_DATABASE_URL: >-
        postgresql://postgres:postgres@localhost:5432/postgres

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Check migrations
        run: alembic check

      - name: Run backend tests
        run: python -m pytest -v


  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build


  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t greenops-backend:test \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=http://localhost:8000/api/v1 \
            -t greenops-frontend:test \
            ./frontend

      - name: Validate Docker Compose
        run: docker compose config